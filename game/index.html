<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sky Courier — Ring Run</title>
<style>
  html, body { margin: 0; padding: 0; background: #0b1020; height: 100%; overflow: hidden; }
  body { font-family: "Segoe UI", Verdana, sans-serif; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; background: #87a8d8; }
  #hint {
    position: fixed; left: 50%; bottom: 10px; transform: translateX(-50%);
    color: rgba(255,255,255,.55); font-size: 12px; letter-spacing: .5px;
    text-shadow: 0 1px 2px #000; pointer-events: none; white-space: nowrap;
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="1280" height="720"></canvas></div>
<div id="hint">Arrows / mouse steer &nbsp;·&nbsp; W / S throttle &nbsp;·&nbsp; P pause &nbsp;·&nbsp; R restart &nbsp;·&nbsp; M mute</div>
<script src="game.js"></script>
</body>
</html>
